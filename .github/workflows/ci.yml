name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: flutter analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Show analyzer problems
        if: failure()
        run: grep -E "^ *(error|warning|info) " analyze.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done
      - name: flutter test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Show failing tests
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          grep -E "\[E\]|Expected:|Actual:|Some tests failed|Error:" test.log | head -30 | while IFS= read -r line; do echo "::error::${line}"; done

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build release APKs (one per CPU type)
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          # Surface the reasons as annotations so they are readable without opening the full log.
          grep -nE "^e: |error:|FAILURE|What went wrong|Execution failed|Could not|Unresolved|> Task .* FAILED|Exception" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "::error::$(tail -n 25 build.log | tr '\n' '|' | cut -c1-3000)"
      - name: Report APK sizes (target is under 40 MB)
        run: |
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            mb=$(( $(stat -c %s "$f") / 1048576 ))
            echo "::notice::$(basename "$f"): ${mb} MB"
            if [ "$mb" -ge 40 ]; then echo "::warning::$(basename "$f") is ${mb} MB, over the 40 MB target"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: solo-calisthenics-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30

  ios:
    name: Build iOS (no signing)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build for iPhone without code signing
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          grep -nE "error:|Error:|\[!\]|FAILED|could not|Could not|requires a higher minimum|Undefined symbol" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          echo "::error::$(tail -n 25 build.log | tr '\n' '|' | cut -c1-3000)"
